[package]
name = "divide-conquer-processor"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TETSUROU KIZAKI <tech-studio.mk@trkizaki.dev>"]
description = "High-performance divide and conquer algorithms for large-scale data processing"
repository = "https://github.com/TRkizaki/divide-conquer-processor"

[dependencies]

rayon = "1.8"

criterion = { version = "0.6.0", features = ["html_reports"] }

rand = "0.9.1"

statistical = "1.0"

memory-stats = "1.1"

clap = { version = "4.4", features = ["derive"] }

plotters = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

colored = "3.0"

chrono = { version = "0.4", features = ["serde"] }

# Advanced benchmarking dependencies
libc = "0.2"
sysinfo = "0.32"
perf-event = "0.4"

# Thread affinity for P-core/E-core experiments
core_affinity = "0.8"
num_cpus = "1.16"

# Cross-platform validation dependencies
# (rayon already included above)

[dev-dependencies]
criterion = { version = "0.6.0", features = ["html_reports"] }
